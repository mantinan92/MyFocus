<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>My Focus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --red:       #C8373A;
    --red-light: #FBEAEA;
    --red-mid:   #E8C0C0;
    --navy:      #1C2B4A;
    --navy-light:#EEF0F5;
    --cream:     #F5F0EB;
    --grey:      #E8E4E0;
    --grey-mid:  #B0A8A0;
    --white:     #FAFAF8;
    --text:      #1C2B4A;
    --text-soft: #6B6460;
    --radius:    16px;
    --shadow:    0 2px 12px rgba(28,43,74,0.08);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* ── CARD BACKGROUNDS ── */
  .vichy-bg   { background-color: var(--white); }
  .vichy-navy { background-color: var(--navy); }
  .vichy-red  { background-color: var(--red); }

  /* ── HEADER ── */
  .app-header {
    padding: 20px 16px 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .app-header h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1;
    color: var(--navy);
  }
  .app-header h1 em { font-style: italic; color: var(--red); }
  .header-date {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-soft);
    text-align: right;
    line-height: 1.3;
  }

  /* ── WEEK NAV BAR ── */
  .week-nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 0;
    gap: 8px;
  }
  .week-nav-arrow {
    width: 36px; height: 36px;
    border-radius: 10px; border: 1.5px solid var(--grey);
    background: var(--white); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--navy); font-size: 18px;
    transition: all 0.15s; font-family: 'Inter', sans-serif;
    flex-shrink: 0;
    box-shadow: var(--shadow);
  }
  .week-nav-arrow:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
  .week-nav-arrow:disabled { opacity: 0.35; cursor: default; }
  .week-nav-label {
    font-size: 13px; font-weight: 600;
    color: var(--text); text-align: center;
    flex: 1;
    background: var(--white);
    border-radius: 10px;
    padding: 8px 10px;
    box-shadow: var(--shadow);
  }

  /* ── VIEWS ── */
  .view { display: none; }
  .view.active { display: block; }

  /* ── DAY NAV ── */
  .day-nav {
    display: flex;
    gap: 6px;
    padding: 12px 16px 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .day-nav::-webkit-scrollbar { display: none; }
  .day-btn {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 8px 10px;
    border-radius: 12px;
    border: 1.5px solid transparent;
    background: var(--white);
    cursor: pointer;
    transition: all 0.18s;
    font-family: 'Inter', sans-serif;
  }
  .day-btn .d-label {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-soft);
  }
  .day-btn .d-num { font-size: 17px; font-weight: 600; color: var(--text); }
  .day-btn.active { background: var(--navy); border-color: var(--navy); }
  .day-btn.active .d-label,
  .day-btn.active .d-num { color: #fff; }
  .day-btn.is-today-inactive { background: #c8d3e8; } /* light navy-gray for today when not selected */
  .day-btn.is-past { background: #e8e8e8; } /* light gray for past dates */
  .day-btn:not(.active):hover { border-color: var(--red); }
  .day-btn.has-tasks .d-num::after {
    content: '·'; color: var(--red);
    font-size: 22px; line-height: 0;
    vertical-align: -4px; margin-left: 1px;
  }
  .day-btn.rest-day { opacity: 0.7; }
  .day-btn.rest-day.active { background: var(--grey-mid); border-color: var(--grey-mid); }
  .day-btn.rest-day:not(.active):hover { border-color: var(--grey-mid); }
  .d-rest {
    font-size: 8px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--grey-mid);
    margin-top: 1px;
  }
  .day-btn.active .d-rest { color: rgba(255,255,255,0.6); }

  /* ── BENTO GRID ── */
  .bento {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 12px 16px 0;
  }

  /* ── CARDS ── */
  .card {
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .card.full-width { grid-column: 1 / -1; }

  .card-label {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .card-label .dot {
    width: 7px; height: 7px;
    border-radius: 50%; flex-shrink: 0;
  }

  .card-mit { min-height: 140px; }
  .card-mit .card-label { color: rgba(255,255,255,0.7); }
  .card-mit .dot { background: var(--red); box-shadow: 0 0 0 3px rgba(200,55,58,0.3); }

  .mit-input-wrap {
    display: flex; align-items: flex-start;
    gap: 10px; margin-top: 4px;
  }
  .mit-check {
    flex-shrink: 0;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35);
    background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.18s; margin-top: 3px;
  }
  .mit-check.checked { background: var(--red); border-color: var(--red); }
  .mit-check svg { display: none; }
  .mit-check.checked svg { display: block; }

  .mit-text {
    font-family: 'Playfair Display', serif;
    font-size: 20px; font-weight: 600; font-style: italic;
    color: #fff; background: transparent;
    border: none; outline: none;
    width: 100%; resize: none;
    line-height: 1.35; min-height: 54px;
  }
  .mit-text::placeholder { color: rgba(255,255,255,0.35); }
  .mit-text.done { text-decoration: line-through; opacity: 0.55; }

  .mit-actions { margin-top: 10px; display: flex; justify-content: flex-end; }

  .card-short .card-label { color: var(--navy); }
  .card-short .dot { background: var(--red); }
  .card-maint .card-label { color: var(--navy); }
  .card-maint .dot { background: var(--navy); }

  /* ── MAINTENANCE HABIT BUTTONS ── */
  .habit-list { display: flex; flex-direction: column; gap: 8px; }
  .habit-row { display: flex; align-items: stretch; gap: 6px; }
  .habit-btn {
    display: flex; align-items: center; gap: 10px;
    flex: 1; min-width: 0; text-align: left;
    padding: 11px 12px;
    border-radius: 11px;
    border: 1.5px solid var(--grey);
    background: var(--white);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
  }
  .habit-btn:hover:not(:disabled) { border-color: var(--navy); }
  .habit-btn-check {
    flex-shrink: 0; width: 22px; height: 22px;
    border-radius: 50%; border: 1.5px solid var(--grey-mid);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .habit-btn-check svg { display: none; }
  .habit-row.done .habit-btn-check { background: var(--navy); border-color: var(--navy); }
  .habit-row.done .habit-btn-check svg { display: block; }
  .habit-btn-label {
    flex: 1; min-width: 0; font-size: 14px; font-weight: 500; color: var(--text);
    transition: color 0.15s;
  }
  .habit-row.done .habit-btn { background: var(--navy-light); border-color: var(--navy-light); }
  .habit-row.done .habit-btn-label {
    text-decoration: line-through; color: var(--grey-mid);
  }
  .habit-btn:disabled { cursor: default; opacity: 0.6; }

  /* Skip button alongside each habit row */
  .habit-skip-btn {
    flex-shrink: 0; width: 38px;
    border-radius: 11px; border: 1.5px solid var(--grey);
    background: var(--white); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--grey-mid);
    transition: all 0.15s;
  }
  .habit-skip-btn:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
  .habit-skip-btn.active { background: var(--text-soft); border-color: var(--text-soft); color: #fff; }
  .habit-skip-btn:disabled { cursor: default; opacity: 0.5; }

  /* Skipped row state */
  .habit-row.skipped .habit-btn {
    background: var(--grey); border-color: var(--grey);
    border-style: dashed;
  }
  .habit-row.skipped .habit-btn-label { color: var(--text-soft); }
  .habit-skip-tag {
    font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-soft);
    background: rgba(28,43,74,0.08);
    border-radius: 5px; padding: 2px 6px; margin-left: 6px;
    white-space: nowrap;
  }

  /* Per-habit weekly day dots (used in week review) */
  .habit-week-row { margin-bottom: 12px; }
  .habit-week-row:last-child { margin-bottom: 0; }
  .habit-week-name {
    font-size: 13px; font-weight: 600; color: var(--text);
    margin-bottom: 6px;
  }
  .habit-week-days { display: flex; gap: 6px; }
  .habit-day-pill {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 6px 2px;
    border-radius: 9px; background: var(--cream);
  }
  .habit-day-pill .hdp-label {
    font-size: 9px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--grey-mid);
  }
  .habit-day-pill .hdp-mark {
    width: 18px; height: 18px; border-radius: 50%;
    border: 1.5px solid var(--grey-mid);
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    color: var(--grey-mid);
  }
  .habit-day-pill.complete { background: var(--navy-light); }
  .habit-day-pill.complete .hdp-label { color: var(--navy); }
  .habit-day-pill.complete .hdp-mark { background: var(--navy); border-color: var(--navy); color: #fff; }
  .habit-day-pill .hdp-mark svg { display: none; }
  .habit-day-pill.complete .hdp-mark svg { display: block; }
  .habit-day-pill.skipped { background: var(--grey); }
  .habit-day-pill.skipped .hdp-label { color: var(--text-soft); }
  .habit-day-pill.skipped .hdp-mark { border-style: dashed; }
  .habit-day-pill.skipped .hdp-mark svg { display: block; }

  /* ── TASK LIST ── */
  .task-list { display: flex; flex-direction: column; gap: 6px; }

  .task-item {
    display: flex; align-items: flex-start;
    gap: 8px; padding: 6px 0;
    border-bottom: 1px solid rgba(28,43,74,0.08);
    position: relative;
  }
  .task-item:last-child { border-bottom: none; }

  .task-check {
    flex-shrink: 0; width: 20px; height: 20px;
    border-radius: 5px; border: 1.5px solid var(--grey-mid);
    background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; margin-top: 2px;
  }
  .task-check.checked { background: var(--red); border-color: var(--red); }
  .task-check svg { display: none; }
  .task-check.checked svg { display: block; }

  .task-input {
    flex: 1; font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 400; color: var(--text);
    background: transparent; border: none; outline: none;
    resize: none; min-height: 20px; line-height: 1.45; padding: 0;
  }
  .task-input::placeholder { color: var(--grey-mid); }
  .task-input.done { text-decoration: line-through; color: var(--grey-mid); }

  .task-menu-btn {
    flex-shrink: 0; width: 24px; height: 24px;
    border-radius: 6px; border: none;
    background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--grey-mid); padding: 0;
    transition: color 0.15s, background 0.15s;
  }
  .task-menu-btn:hover { color: var(--navy); background: var(--grey); }

  /* ── MOVE POPOVER ── */
  .move-popover {
    position: fixed; z-index: 100;
    background: var(--white);
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(28,43,74,0.18);
    padding: 12px; min-width: 200px;
    display: none; border: 1.5px solid var(--grey);
  }
  .move-popover.show { display: block; }
  .move-popover-title {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.10em; text-transform: uppercase;
    color: var(--text-soft); margin-bottom: 8px;
  }
  .move-day-list { display: flex; flex-direction: column; gap: 3px; }
  .move-day-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 9px; cursor: pointer;
    font-size: 14px; font-weight: 500;
    transition: background 0.13s;
    border: none; background: transparent;
    width: 100%; text-align: left;
    color: var(--text); font-family: 'Inter', sans-serif;
  }
  .move-day-item:hover { background: var(--navy-light); }
  .move-day-item.current { color: var(--grey-mid); cursor: default; }
  .move-day-item .di-day { font-weight: 600; min-width: 28px; }
  .move-day-item .di-date { font-size: 12px; color: var(--text-soft); }
  .popover-close {
    width: 100%; margin-top: 8px; padding: 7px;
    border-radius: 8px; border: 1px solid var(--grey);
    background: transparent; font-size: 13px; font-weight: 500;
    color: var(--text-soft); cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .popover-close:hover { background: var(--grey); }

  /* ── OVERLAY ── */
  .overlay {
    display: none; position: fixed; inset: 0;
    z-index: 90; background: rgba(28,43,74,0.15);
    backdrop-filter: blur(1px);
  }
  .overlay.show { display: block; }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    grid-column: 1 / -1;
    background: var(--white); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 12px;
  }
  .progress-bar-bg {
    flex: 1; height: 6px; background: var(--grey);
    border-radius: 99px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--red);
    border-radius: 99px;
    transition: width 0.35s cubic-bezier(.4,0,.2,1), background 0.35s ease;
    min-width: 0;
  }
  .progress-bar-fill.bar-yellow { background: #C9940A; }
  .progress-bar-fill.bar-green  { background: #2E7D52; }
  .progress-label { font-size: 12px; font-weight: 600; color: var(--text-soft); white-space: nowrap; }
  .progress-emoji { font-size: 16px; }

  /* ── FOOTER ── */
  .app-footer {
    padding: 20px 16px 0;
    display: flex; justify-content: flex-end; align-items: center;
  }
  .clear-btn {
    font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--text-soft);
    background: transparent; border: 1px solid var(--grey);
    border-radius: 8px; padding: 5px 10px; cursor: pointer;
    font-family: 'Inter', sans-serif; transition: all 0.15s;
  }
  .clear-btn:hover { color: var(--red); border-color: var(--red); }

  /* ══════════════════════════════════════
     WEEKLY SUMMARY VIEW
  ══════════════════════════════════════ */
  .week-view {
    padding: 12px 16px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Week range selector */
  .week-selector {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--white);
    border-radius: var(--radius);
    padding: 10px 14px;
    box-shadow: var(--shadow);
  }
  .week-nav-btn {
    width: 32px; height: 32px;
    border-radius: 8px; border: 1.5px solid var(--grey);
    background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--navy); font-size: 16px;
    transition: all 0.15s; font-family: 'Inter', sans-serif;
  }
  .week-nav-btn:hover { border-color: var(--red); color: var(--red); }
  .week-range-label {
    font-size: 13px; font-weight: 600;
    color: var(--text); text-align: center;
  }

  /* Overall stats card */
  .stat-hero {
    background: var(--navy);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .stat-hero-label {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(255,255,255,0.55); margin-bottom: 14px;
    display: flex; align-items: center; gap: 6px;
  }
  .stat-hero-label .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex-shrink: 0; }

  .stat-big-row {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    margin-bottom: 14px;
  }
  .stat-big-num {
    font-family: 'Playfair Display', serif;
    font-size: 52px; font-weight: 700;
    color: #fff; line-height: 1;
  }
  .stat-big-denom {
    font-size: 20px; font-weight: 600;
    color: rgba(255,255,255,0.45);
    padding-bottom: 6px;
  }
  .stat-big-pct {
    margin-left: auto;
    font-family: 'Playfair Display', serif;
    font-size: 36px; font-weight: 600; font-style: italic;
    color: var(--red); padding-bottom: 4px;
  }

  .week-bar-bg {
    height: 8px; background: rgba(255,255,255,0.15);
    border-radius: 99px; overflow: hidden; margin-bottom: 14px;
  }
  .week-bar-fill {
    height: 100%;
    background: var(--red);
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1), background 0.5s ease;
  }
  .week-bar-fill.bar-yellow { background: #C9940A; }
  .week-bar-fill.bar-green  { background: #2E7D52; }

  .stat-row-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .stat-mini {
    background: rgba(255,255,255,0.07);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
  }
  .stat-mini-num {
    font-size: 20px; font-weight: 700;
    color: #fff; line-height: 1;
    margin-bottom: 3px;
  }
  .stat-mini-label {
    font-size: 9px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(255,255,255,0.45);
  }

  /* Section summary cards */
  .section-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .section-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-card-title {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text);
    display: flex; align-items: center; gap: 6px;
  }
  .section-card-title .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .section-pct-badge {
    font-size: 13px; font-weight: 700;
    color: var(--white);
    background: var(--navy);
    border-radius: 8px;
    padding: 3px 9px;
  }
  .section-pct-badge.pct-red    { background: var(--red); }
  .section-pct-badge.pct-yellow { background: #C9940A; }
  .section-pct-badge.pct-green  { background: #2E7D52; }
  .section-pct-badge.empty      { background: var(--grey-mid); }

  /* Mini bar inside section card */
  .section-bar-bg {
    height: 5px; background: var(--grey);
    border-radius: 99px; overflow: hidden; margin-bottom: 12px;
  }
  .section-bar-fill {
    height: 100%;
    background: var(--red);
    border-radius: 99px;
    transition: width 0.4s ease, background 0.4s ease;
  }
  .section-bar-fill.bar-yellow { background: #C9940A; }
  .section-bar-fill.bar-green  { background: #2E7D52; }

  /* Sub-section label within section card */
  .sub-label {
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.10em; text-transform: uppercase;
    color: var(--grey-mid); margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--grey);
  }

  /* Uncompleted task list */
  .uncomplete-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .uncomplete-item {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 13px; color: var(--text); line-height: 1.4;
  }
  .uncomplete-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--red-mid); flex-shrink: 0; margin-top: 5px;
  }
  .uncomplete-day {
    font-size: 10px; font-weight: 600;
    color: var(--grey-mid); white-space: nowrap; margin-top: 2px;
  }

  .empty-state {
    font-size: 13px; color: var(--grey-mid);
    font-style: italic; padding: 4px 0;
  }

  /* ── READONLY / PAST DAY ── */
  .day-readonly .mit-text,
  .day-readonly .task-input { cursor: default; pointer-events: none; color: var(--text-soft); }
  .day-readonly .mit-check,
  .day-readonly .task-check,
  .day-readonly .task-menu-btn,
  .day-readonly .mit-actions { pointer-events: none; opacity: 0.4; }
  .day-readonly .mit-check:not(.checked),
  .day-readonly .task-check:not(.checked) { border-color: var(--grey); }
  .readonly-banner {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 7px;
    background: var(--grey); border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px; font-weight: 600; color: var(--text-soft);
  }

  /* ── POPOVER MODE TABS ── */
  .popover-mode-tabs {
    display: flex; gap: 4px; margin-bottom: 2px;
  }
  .popover-mode-tab {
    flex: 1; padding: 7px 4px;
    border-radius: 8px; border: 1.5px solid var(--grey);
    background: transparent; font-size: 12px; font-weight: 600;
    color: var(--text-soft); cursor: pointer; font-family: 'Inter', sans-serif;
    transition: all 0.15s;
  }
  .popover-mode-tab.active {
    background: var(--navy); border-color: var(--navy); color: #fff;
  }
  .popover-mode-tab:not(.active):hover { border-color: var(--red); color: var(--red); }

  /* Copy multi-select checkboxes */
  .copy-day-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 9px; cursor: pointer;
    font-size: 14px; font-weight: 500;
    transition: background 0.13s;
    border: 1.5px solid transparent;
    background: transparent;
    width: 100%; text-align: left;
    color: var(--text); font-family: 'Inter', sans-serif;
  }
  .copy-day-item:hover { background: var(--navy-light); }
  .copy-day-item.selected { background: var(--navy-light); border-color: var(--navy); }
  .copy-day-item .cdi-check {
    width: 18px; height: 18px; border-radius: 5px;
    border: 1.5px solid var(--grey-mid); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .copy-day-item.selected .cdi-check { background: var(--navy); border-color: var(--navy); }
  .copy-day-item .di-day { font-weight: 600; min-width: 28px; }
  .copy-day-item .di-date { font-size: 12px; color: var(--text-soft); }

  .popover-confirm-btn {
    width: 100%; margin-top: 8px; padding: 9px;
    border-radius: 8px; border: none;
    background: var(--navy); font-size: 13px; font-weight: 600;
    color: #fff; cursor: pointer; font-family: 'Inter', sans-serif;
    transition: opacity 0.15s;
  }
  .popover-confirm-btn:disabled { opacity: 0.35; cursor: default; }
  .popover-confirm-btn:not(:disabled):hover { opacity: 0.88; }

  /* ── SATURDAY REST DAY ── */
  .saturday-view {
    padding: 12px 16px 0;
  }
  .saturday-hero {
    background: var(--navy);
    border-radius: var(--radius);
    padding: 20px 20px 16px;
    box-shadow: var(--shadow);
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 14px;
  }
  .saturday-icon { font-size: 36px; flex-shrink: 0; }
  .saturday-hero-text {}
  .saturday-hero-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 700; font-style: italic;
    color: #fff; margin-bottom: 3px;
  }
  .saturday-hero-sub {
    font-size: 12px; font-weight: 500;
    color: rgba(255,255,255,0.5);
  }

  /* ── focus ring ── */
  :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <h1>My <em>Focus</em></h1>
  <div class="header-date" id="headerDate"></div>
</header>

<!-- Week nav bar -->
<div class="week-nav-bar" id="weekNavBar">
  <button class="week-nav-arrow" id="weekPrevBtn" onclick="shiftWeek(-1)" aria-label="Previous week">&#8592;</button>
  <div class="week-nav-label" id="weekNavLabel"></div>
  <button class="week-nav-arrow" id="weekNextBtn" onclick="shiftWeek(1)" aria-label="Next week">&#8594;</button>
</div>

<!-- ══ TODAY VIEW ══ -->
<div class="view active" id="viewToday">

  <!-- DAY NAV -->
  <nav class="day-nav" id="dayNav" aria-label="Day navigation"></nav>

  <!-- BENTO GRID -->
  <main class="bento" id="bentoGrid">

    <!-- PROGRESS -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-emoji" id="progressEmoji">🎯</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>

    <!-- MIT CARD -->
    <div class="card card-mit vichy-navy full-width" id="mitCard">
      <div class="card-label">
        <span class="dot"></span>

      </div>
      <div class="mit-input-wrap">
        <button class="mit-check" id="mitCheck" aria-label="Complete MIT" onclick="toggleMIT()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">

          </svg>
        </button>

      <div class="mit-actions">

          Move →
        </button>

    <!-- SHORTER TASKS CARD -->

    <!-- MAINTENANCE TASKS CARD -->
    <div class="card card-maint vichy-bg full-width">
      <div class="card-label">

        Maintenance
      </div>

  </main>

  <!-- FOOTER -->

</div><!-- /viewToday -->

<!-- ══ WEEK VIEW ══ -->

  <div class="week-view" id="weekContent"></div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closePopover()"></div>

<!-- TASK ACTION POPOVER -->
<div class="move-popover" id="movePopover" role="dialog" aria-label="Task actions">
  <!-- Mode selector tabs -->
  <div class="popover-mode-tabs" id="popoverModeTabs">
    <button class="popover-mode-tab active" id="modeTabMove" onclick="setPopoverMode('move')">Move</button>
    <button class="popover-mode-tab" id="modeTabCopy" onclick="setPopoverMode('copy')">Copy to…</button>
  </div>

  <!-- MOVE panel -->
  <div id="movePanelInner">
    <div class="move-popover-title" style="margin-top:8px">Move to future day</div>
    <div class="move-day-list" id="moveDayList"></div>
  </div>

  <!-- COPY panel -->
  <div id="copyPanelInner" style="display:none">
    <div class="move-popover-title" style="margin-top:8px">Copy to (select days)</div>
    <div class="move-day-list" id="copyDayList"></div>
    <button class="popover-confirm-btn" id="copyConfirmBtn" onclick="confirmCopy()">Copy to selected</button>
  </div>

  <button class="popover-close" onclick="closePopover()">Cancel</button>

<script>
// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
const DAY_NAMES   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function today() {
  const d = new Date();
  d.setHours(0,0,0,0);
  return d;
}
function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateFromKey(dk) {
  const [y,m,d] = dk.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setHours(0,0,0,0);
  return dt;
}

// Week offset: 0 = current week (containing today), -1 = last week, +1 = next, +2 = two ahead
// Weeks run Sun–Sat. Range: -1 to +2
let dayNavWeekOffset = 0;

function getSundayOfWeek(d) {
  const s = new Date(d);
  s.setDate(d.getDate() - d.getDay()); // go back to Sunday
  s.setHours(0,0,0,0);
  return s;
}

function getWeekDatesForOffset(offset) {
  const base = today();
  const sunday = getSundayOfWeek(base);
  sunday.setDate(sunday.getDate() + offset * 7);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(sunday);
    d.setDate(sunday.getDate() + i);
    days.push(d);
  }
  return days;
}

function getWeekDates() {
  return getWeekDatesForOffset(dayNavWeekOffset);
}

// Returns up to N future business days (Mon–Fri) from a given date key
function getFutureBusinessDays(fromDk, maxBizDays) {
  const result = [];
  const base = dateFromKey(fromDk);
  let bizCount = 0;
  let i = 1;
  while (bizCount < maxBizDays && i <= 30) {
    const d = new Date(base);
    d.setDate(base.getDate() + i);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6) { // not Sun or Sat
      result.push(d);
      bizCount++;
    }
    i++;
  }
  return result;
}

// Returns up to 7 calendar days ahead (any day except Saturday)
function getFutureCopyDays(fromDk, maxDays) {
  const result = [];
  const base = dateFromKey(fromDk);
  let i = 1;
  while (result.length < maxDays && i <= 14) {
    const d = new Date(base);
    d.setDate(base.getDate() + i);
    if (d.getDay() !== 6) { // exclude Saturday (rest day)
      result.push(d);
    }
    i++;
  }
  return result;
}

function isSaturday(dk) {
  return dateFromKey(dk).getDay() === 6;
}

// Week offset for summary (0 = current Mon–Sun, -1 = last week, etc.)
let weekOffset = 0;

function getWeekRange(offset) {
  // Returns Sun–Sat of the week containing today + offset*7 days
  const base   = today();
  const sunday = new Date(base);
  sunday.setDate(base.getDate() - base.getDay() + offset * 7);
  const saturday = new Date(sunday);
  saturday.setDate(sunday.getDate() + 6);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(sunday);
    d.setDate(sunday.getDate() + i);
    days.push(d);
  }
  return { monday: sunday, sunday: saturday, days };
}

let currentDateKey = dateKey(today());
let pendingMove    = null;
let pendingCopy    = null;
let copySelections = new Set();
let popoverMode    = 'move';
let currentTab     = 'today';

// ─────────────────────────────────────────
// STORAGE
// ─────────────────────────────────────────
function loadData(key) {
  try {
    const raw = localStorage.getItem('myfocus_' + key);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function saveData(key, val) {
  try { localStorage.setItem('myfocus_' + key, JSON.stringify(val)); } catch {}
}

const MAINT_HABITS = [
  { key: 'quiet',    label: 'Quiet Time' },
  { key: 'workout',  label: 'Workout' },
  { key: 'reading',  label: 'Reading' },
];

function emptyDay() {
  return {
    mit:   { text: '', done: false },
    short: [
      { text: '', done: false },
      { text: '', done: false },
      { text: '', done: false },
    ],
    maint: { quiet: 'open', workout: 'open', reading: 'open' },
  };
}

const MAINT_STATES = ['open', 'done', 'skip'];

function getDayData(dk) {
  const d = loadData('day_' + dk) || emptyDay();
  // Migrate old data that lacks the new fields, and drop legacy move tracking.
  if (!d.mit) d.mit = { text: '', done: false };
  delete d.mit.moves;
  (d.short || []).forEach(t => { delete t.moves; });
  // Migrate legacy maintenance shapes (task-list array, or boolean-per-habit) into tri-state strings
  if (Array.isArray(d.maint) || !d.maint) {
    d.maint = { quiet: 'open', workout: 'open', reading: 'open' };
  } else {
    MAINT_HABITS.forEach(h => {
      const v = d.maint[h.key];
      if (typeof v === 'boolean') d.maint[h.key] = v ? 'done' : 'open';
      else if (!MAINT_STATES.includes(v)) d.maint[h.key] = 'open';
    });
  }
  return d;
}
function setDayData(dk, data) {
  saveData('day_' + dk, data);
}

// ─────────────────────────────────────────
// TABS
// ─────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('viewToday').classList.toggle('active', tab === 'today');
  document.getElementById('viewWeek').classList.toggle('active',  tab === 'week');
  if (tab === 'week') renderWeekSummary();
}

// ─────────────────────────────────────────
// HEADER DATE
// ─────────────────────────────────────────
function renderHeaderDate() {
  const d = today();
  document.getElementById('headerDate').innerHTML =
    `${DAY_NAMES[d.getDay()]}<br>${MONTH_NAMES[d.getMonth()]} ${d.getDate()}`;
}

// ─────────────────────────────────────────
// DAY NAV
// ─────────────────────────────────────────
function renderDayNav(skipScroll) {
  const nav = document.getElementById('dayNav');
  nav.innerHTML = '';
  const todayKey = dateKey(today());
  const weekDays = getWeekDates();

  weekDays.forEach(d => {
    const dk  = dateKey(d);
    const isSat = d.getDay() === 6;
    const isActive = dk === currentDateKey;
    const isPast = dk < todayKey;
    const isToday = dk === todayKey;

    const btn = document.createElement('button');
    let cls = 'day-btn';
    if (isActive) {
      cls += ' active';
    } else if (isToday) {
      cls += ' is-today-inactive'; // light navy-gray
    } else if (isPast) {
      cls += ' is-past'; // light gray
    }
    if (isSat) cls += ' rest-day';
    btn.className = cls;
    btn.setAttribute('aria-label', `${DAY_NAMES[d.getDay()]} ${d.getDate()}${isSat ? ' (rest day)' : ''}`);
    btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
    const dd = loadData('day_' + dk);
    const hasData = !isSat && dd && (dd.mit?.text || dd.short?.some(t=>t.text) || (dd.maint && (Array.isArray(dd.maint) ? dd.maint.some(t=>t.text) : Object.values(dd.maint).some(Boolean))));
    if (hasData) btn.classList.add('has-tasks');
    const satLabel = isSat ? '<span class="d-rest">REST</span>' : '';
    btn.innerHTML = `<span class="d-label">${DAY_NAMES[d.getDay()]}</span><span class="d-num">${d.getDate()}</span>${satLabel}`;
    btn.onclick = () => switchDay(dk);
    nav.appendChild(btn);
  });

  updateWeekNavBar();

  // Scroll the day-nav strip horizontally only (never move the page vertically).
  // Skip entirely when called from text entry so the page stays perfectly still.
  if (!skipScroll) {
    setTimeout(() => {
      const active = nav.querySelector('.active');
      if (active) {
        const target = active.offsetLeft - (nav.clientWidth / 2) + (active.clientWidth / 2);
        nav.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
      }
    }, 50);
  }
}

function updateWeekNavBar() {
  const days = getWeekDatesForOffset(dayNavWeekOffset);
  const sun = days[0], sat = days[6];
  const fmtShort = d => `${MONTH_NAMES[d.getMonth()]} ${d.getDate()}`;
  document.getElementById('weekNavLabel').textContent = `${fmtShort(sun)} – ${fmtShort(sat)}`;
  document.getElementById('weekPrevBtn').disabled = dayNavWeekOffset <= -1;
  document.getElementById('weekNextBtn').disabled = dayNavWeekOffset >= 2;
}

function shiftWeek(delta) {
  const newOffset = dayNavWeekOffset + delta;
  if (newOffset < -1 || newOffset > 2) return;
  dayNavWeekOffset = newOffset;
  renderDayNav();
}

function switchDay(dk) {
  currentDateKey = dk;
  // Ensure dayNavWeekOffset corresponds to the week containing dk
  const todaySun = getSundayOfWeek(today());
  const dSun = getSundayOfWeek(dateFromKey(dk));
  const diffWeeks = Math.round((dSun - todaySun) / (7 * 86400000));
  if (diffWeeks !== dayNavWeekOffset) {
    dayNavWeekOffset = Math.max(-1, Math.min(2, diffWeeks));
  }
  renderDayNav();
  if (isSaturday(dk)) {
    renderSaturdayView();
  } else {
    renderDay();
  }
}

// ─────────────────────────────────────────
// RENDER DAY
// ─────────────────────────────────────────
function renderSaturdayView() {
  // Hide bento, footer; show Saturday summary panel instead
  document.getElementById('bentoGrid').style.display = 'none';
  document.querySelector('.app-footer').style.display = 'none';

  let satView = document.getElementById('saturdayView');
  if (!satView) {
    satView = document.createElement('div');
    satView.id = 'saturdayView';
    satView.className = 'saturday-view';
    document.getElementById('viewToday').appendChild(satView);
  }
  satView.style.display = 'block';

  // Use the week that contains this Saturday
  const satDate = dateFromKey(currentDateKey);
  // Find Sunday of that week (Saturday is day 6, so Sunday is sat - 6)
  const sunday = new Date(satDate);
  sunday.setDate(satDate.getDate() - 6); // Sat - 6 = Sun

  const days = [];
  for (let i = 0; i < 6; i++) { // Sun–Fri only (6 days)
    const d = new Date(sunday);
    d.setDate(sunday.getDate() + i);
    days.push(d);
  }

  const fmtDate = d => `${MONTH_NAMES[d.getMonth()]} ${d.getDate()}`;
  const fri = days[5];

  const { sections, totalTasks, doneTasks } = buildWeekSections(days);
  const overallPct = totalTasks ? Math.round((doneTasks / totalTasks) * 100) : 0;

  satView.innerHTML = `
    <div class="saturday-hero">
      <div class="saturday-icon">☀️</div>
      <div class="saturday-hero-text">
        <div class="saturday-hero-title">Rest Day</div>
        <div class="saturday-hero-sub">${fmtDate(sunday)} – ${fmtDate(fri)} · Week Review</div>
      </div>
    </div>
    <div id="weekContent" class="week-view"></div>
  `;

  // Reuse existing week summary renderer but populate into this container
  buildWeekSummaryInto(document.getElementById('weekContent'), days, sections, totalTasks, doneTasks, overallPct, sunday, fri);
}

// Builds the mit/short/maint section data for a given set of day Date objects.
// Maintenance is tracked per fixed habit (Quiet Time, Workout, Reading) rather
// than as a free-form task list — each habit shows which days it was completed.
function buildWeekSections(days) {
  let totalTasks = 0, doneTasks = 0;
  const sections = {
    mit:   { label: 'Most Important Task', dotColor: 'var(--red)',  tasks: [] },
    short: { label: 'Shorter Tasks',       dotColor: 'var(--red)',  tasks: [] },
    maint: {
      label: 'Maintenance', dotColor: 'var(--navy)',
      habits: MAINT_HABITS.map(h => ({ key: h.key, label: h.label, doneDayKeys: [], skipDayKeys: [] })),
    },
  };
  days.forEach(d => {
    const dk   = dateKey(d);
    const data = getDayData(dk);
    const addTask = (t, sk) => {
      if (!t.text) return;
      sections[sk].tasks.push({ ...t, dayKey: dk });
      totalTasks++;
      if (t.done) doneTasks++;
    };
    addTask(data.mit, 'mit');
    (data.short || []).forEach(t => addTask(t, 'short'));

    MAINT_HABITS.forEach(h => {
      const state = (data.maint && data.maint[h.key]) || 'open';
      const habit = sections.maint.habits.find(x => x.key === h.key);
      if (state === 'skip') {
        habit.skipDayKeys.push(dk);
        return; // excluded from totals entirely
      }
      totalTasks++;
      if (state === 'done') {
        doneTasks++;
        habit.doneDayKeys.push(dk);
      }
    });
  });
  return { sections, totalTasks, doneTasks };
}


function buildWeekSummaryInto(container, days, sections, totalTasks, doneTasks, overallPct, monday, fri) {
  container.innerHTML = '';
  const undone = totalTasks - doneTasks;

  const hero = document.createElement('div');
  hero.className = 'stat-hero';
  hero.innerHTML = `
    <div class="stat-hero-label"><span class="dot"></span>Week at a Glance</div>
    <div class="stat-big-row">
      <div class="stat-big-num">${doneTasks}</div>
      <div class="stat-big-denom">/ ${totalTasks}</div>
      <div class="stat-big-pct" style="color:${overallPct>=85?'#2E7D52':overallPct>=50?'#C9940A':'var(--red)'}">${overallPct}%</div>
    </div>
    <div class="week-bar-bg">
      <div class="week-bar-fill ${barColorClass(overallPct)}" style="width:${overallPct}%"></div>
    </div>
    <div class="stat-row-grid">
      <div class="stat-mini"><div class="stat-mini-num">${doneTasks}</div><div class="stat-mini-label">Completed</div></div>
      <div class="stat-mini"><div class="stat-mini-num">${undone}</div><div class="stat-mini-label">Open</div></div>
    </div>
  `;
  container.appendChild(hero);

  Object.entries(sections).forEach(([key, sec]) => {
    const card = document.createElement('div');
    card.className = 'section-card';

    if (key === 'maint') {
      // Per-habit view: each fixed habit shows which days (Sun–Fri/Sat) it was completed,
      // skipped, or left open. Skipped days are excluded from the completion totals.
      const sTotal = sec.habits.reduce((sum, h) => sum + (days.length - h.skipDayKeys.length), 0);
      const sDone  = sec.habits.reduce((sum, h) => sum + h.doneDayKeys.length, 0);
      const sPct   = sTotal ? Math.round((sDone / sTotal) * 100) : 0;

      let badgeClass = 'section-pct-badge';
      if (sTotal === 0)    badgeClass += ' empty';
      else if (sPct >= 85) badgeClass += ' pct-green';
      else if (sPct >= 50) badgeClass += ' pct-yellow';
      else                 badgeClass += ' pct-red';

      card.innerHTML = `
        <div class="section-card-header">
          <div class="section-card-title"><span class="dot" style="background:${sec.dotColor}"></span>${sec.label}</div>
          <div class="${badgeClass}">${sTotal ? sPct + '%' : '—'}</div>
        </div>
        <div class="section-bar-bg">
          <div class="section-bar-fill ${sPct >= 85 ? 'bar-green' : sPct >= 50 ? 'bar-yellow' : ''}" style="width:${sPct}%"></div>
        </div>
        <div style="font-size:12px;color:var(--text-soft);margin-bottom:12px;">${sDone} of ${sTotal} completed</div>
        ${sec.habits.map(h => {
          const habitTotal = days.length - h.skipDayKeys.length;
          return `
          <div class="habit-week-row">
            <div class="habit-week-name">${escapeHtml(h.label)} <span style="color:var(--grey-mid);font-weight:500;">(${h.doneDayKeys.length}/${habitTotal}${h.skipDayKeys.length ? `, ${h.skipDayKeys.length} skipped` : ''})</span></div>
            <div class="habit-week-days">
              ${days.map(d => {
                const dk = dateKey(d);
                const complete = h.doneDayKeys.includes(dk);
                const skipped  = h.skipDayKeys.includes(dk);
                const cls = complete ? ' complete' : skipped ? ' skipped' : '';
                const mark = complete
                  ? `<svg width="9" height="9" viewBox="0 0 9 9" fill="none"><polyline points="1,4.5 3.2,6.5 8,1.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`
                  : skipped
                  ? `<svg width="9" height="9" viewBox="0 0 9 9" fill="none"><line x1="1.8" y1="4.5" x2="7.2" y2="4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`
                  : '';
                return `<div class="habit-day-pill${cls}">
                  <span class="hdp-label">${DAY_NAMES[d.getDay()]}</span>
                  <span class="hdp-mark">${mark}</span>
                </div>`;
              }).join('')}
            </div>
          </div>
        `;
        }).join('')}
      `;
      container.appendChild(card);
      return;
    }

    const sTotal = sec.tasks.length;
    const sDone  = sec.tasks.filter(t => t.done).length;
    const sPct   = sTotal ? Math.round((sDone / sTotal) * 100) : 0;
    const sOpen  = sec.tasks.filter(t => !t.done);

    let badgeClass = 'section-pct-badge';
    if (sTotal === 0)    badgeClass += ' empty';
    else if (sPct >= 85) badgeClass += ' pct-green';
    else if (sPct >= 50) badgeClass += ' pct-yellow';
    else                 badgeClass += ' pct-red';

    card.innerHTML = `
      <div class="section-card-header">
        <div class="section-card-title"><span class="dot" style="background:${sec.dotColor}"></span>${sec.label}</div>
        <div class="${badgeClass}">${sTotal ? sPct + '%' : '—'}</div>
      </div>
      <div class="section-bar-bg">
        <div class="section-bar-fill ${sPct >= 85 ? 'bar-green' : sPct >= 50 ? 'bar-yellow' : ''}" style="width:${sPct}%"></div>
      </div>
      <div style="font-size:12px;color:var(--text-soft);margin-bottom:10px;">${sDone} of ${sTotal} task${sTotal !== 1 ? 's' : ''} completed</div>
      ${sOpen.length ? `
        <div class="sub-label">Uncompleted</div>
        <div class="uncomplete-list">
          ${sOpen.map(t => `<div class="uncomplete-item"><span class="uncomplete-dot"></span><div style="flex:1;min-width:0"><div style="font-size:13px;line-height:1.4">${escapeHtml(t.text)}</div><div class="uncomplete-day">${fmtDayKey(t.dayKey)}</div></div></div>`).join('')}
        </div>
      ` : sTotal > 0 ? `<div class="sub-label">Uncompleted</div><div class="empty-state">All completed ✓</div>` : `<div class="empty-state">No tasks this section</div>`}
    `;
    container.appendChild(card);
  });
}

function renderDay() {
  // Hide Saturday view if switching away
  const satView = document.getElementById('saturdayView');
  if (satView) satView.style.display = 'none';
  document.getElementById('bentoGrid').style.display = '';
  document.querySelector('.app-footer').style.display = '';

  const data    = getDayData(currentDateKey);
  const past    = isPastDay(currentDateKey);
  const locked  = isDayLocked(currentDateKey);
  const bento   = document.getElementById('bentoGrid');

  // Toggle readonly class on bento grid (only when actually locked)
  bento.classList.toggle('day-readonly', locked);

  // Add/remove the status banner
  let banner = document.getElementById('readonlyBanner');
  if (banner) banner.remove();
  if (locked) {
    banner = document.createElement('div');
    banner.id = 'readonlyBanner';
    banner.className = 'readonly-banner';
    banner.innerHTML = `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="3" y="5.5" width="7" height="5.5" rx="1.2" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 5.5V3.8a2 2 0 0 1 4 0V5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> Past day — view only`;
    bento.insertBefore(banner, bento.firstChild);
  } else if (past) {
    // Past day still within the grace period (editable until noon today)
    banner = document.createElement('div');
    banner.id = 'readonlyBanner';
    banner.className = 'readonly-banner grace';
    banner.innerHTML = `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 3.6V6.7L8.5 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg> Editable until 3 PM today`;
    bento.insertBefore(banner, bento.firstChild);
  }

  // Hide the reset button for any past day (locked or in grace window)
  const clearBtn = document.querySelector('.app-footer .clear-btn');
  if (clearBtn) clearBtn.style.display = past ? 'none' : '';

  renderMIT(data.mit);
  renderTaskList('shortList', data.short, 'short');
  renderMaintList(data.maint);
  updateProgress();
}

function renderMIT(mit) {
  const check = document.getElementById('mitCheck');
  const text  = document.getElementById('mitText');
  check.className = 'mit-check' + (mit.done ? ' checked' : '');
  text.value = mit.text;
  text.className = 'mit-text' + (mit.done ? ' done' : '');
  autoResize(text);
}

function renderTaskList(listId, tasks, type) {
  const list = document.getElementById(listId);
  list.innerHTML = '';
  tasks.forEach((task, i) => {
    const item = document.createElement('div');
    item.className = 'task-item';

    const check = document.createElement('button');
    check.className = 'task-check' + (task.done ? ' checked' : '');
    check.setAttribute('aria-label', task.done ? 'Mark incomplete' : 'Mark complete');
    check.innerHTML = `<svg width="11" height="11" viewBox="0 0 11 11" fill="none">
      <polyline points="1.5,5.5 4,8 9.5,2" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
    check.onclick = () => toggleTask(type, i);

    const input = document.createElement('textarea');
    input.className = 'task-input' + (task.done ? ' done' : '');
    input.placeholder = type === 'short' ? `Task ${i+1}` : `Habit ${i+1}`;
    input.value = task.text;
    input.rows = 1;
    input.oninput = () => { saveTask(type, i, input.value); autoResize(input); };
    input.onkeydown = e => { if (e.key === 'Enter') e.preventDefault(); };
    autoResize(input);

    const menuBtn = document.createElement('button');
    menuBtn.className = 'task-menu-btn';
    menuBtn.setAttribute('aria-label', 'Move task');
    menuBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <circle cx="7" cy="2.5"  r="1.2" fill="currentColor"/>
      <circle cx="7" cy="7"    r="1.2" fill="currentColor"/>
      <circle cx="7" cy="11.5" r="1.2" fill="currentColor"/>
    </svg>`;
    menuBtn.onclick = e => showMovePopover(type, e, i);

    item.appendChild(check);
    item.appendChild(input);
    item.appendChild(menuBtn);
    list.appendChild(item);
    setTimeout(() => autoResize(input), 0);
  });
}

function renderMaintList(maint) {
  const list = document.getElementById('maintList');
  list.innerHTML = '';
  const locked = isDayLocked(currentDateKey);
  MAINT_HABITS.forEach(h => {
    const state = maint[h.key] || 'open'; // 'open' | 'done' | 'skip'

    const row = document.createElement('div');
    row.className = 'habit-row' + (state === 'done' ? ' done' : state === 'skip' ? ' skipped' : '');

    const main = document.createElement('button');
    main.className = 'habit-btn';
    main.disabled = locked || state === 'skip';
    main.setAttribute('aria-pressed', state === 'done' ? 'true' : 'false');
    main.innerHTML = `
      <span class="habit-btn-check"><svg width="11" height="11" viewBox="0 0 11 11" fill="none">
        <polyline points="1.5,5.5 4,8 9.5,2" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg></span>
      <span class="habit-btn-label">${h.label}${state === 'skip' ? ' <span class="habit-skip-tag">Skipped</span>' : ''}</span>`;
    main.onclick = () => toggleMaintHabit(h.key);

    const skipBtn = document.createElement('button');
    skipBtn.className = 'habit-skip-btn' + (state === 'skip' ? ' active' : '');
    skipBtn.disabled = locked;
    skipBtn.setAttribute('aria-label', state === 'skip' ? `Unskip ${h.label}` : `Skip ${h.label} for today`);
    skipBtn.title = state === 'skip' ? 'Unskip' : 'Skip day';
    skipBtn.innerHTML = state === 'skip'
      ? `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 2.5L9.5 9.5M9.5 2.5L2.5 9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`
      : `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 2.2V9.8M9.5 2.2V9.8M2.5 6L9.5 2.2V9.8L2.5 6Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>`;
    skipBtn.onclick = () => skipMaintHabit(h.key);

    row.appendChild(main);
    row.appendChild(skipBtn);
    list.appendChild(row);
  });
}

function toggleMaintHabit(key) {
  if (isDayLocked(currentDateKey)) return;
  const data = getDayData(currentDateKey);
  if (data.maint[key] === 'skip') return; // must unskip first
  data.maint[key] = data.maint[key] === 'done' ? 'open' : 'done';
  setDayData(currentDateKey, data);
  renderMaintList(data.maint);
  updateProgress();
  renderDayNav(true);
}

function skipMaintHabit(key) {
  if (isDayLocked(currentDateKey)) return;
  const data = getDayData(currentDateKey);
  data.maint[key] = data.maint[key] === 'skip' ? 'open' : 'skip';
  setDayData(currentDateKey, data);
  renderMaintList(data.maint);
  updateProgress();
  renderDayNav(true);
}


function toggleMIT() {
  if (isDayLocked(currentDateKey)) return;
  const data = getDayData(currentDateKey);
  if (!data.mit.text.trim()) return;
  data.mit.done = !data.mit.done;
  setDayData(currentDateKey, data);
  renderMIT(data.mit);
  updateProgress();
}

function saveMIT() {
  if (isDayLocked(currentDateKey)) return;
  const data = getDayData(currentDateKey);
  data.mit.text = document.getElementById('mitText').value;
  setDayData(currentDateKey, data);
  renderDayNav(true);
}

function toggleTask(type, index) {
  if (isDayLocked(currentDateKey)) return;
  const data = getDayData(currentDateKey);
  if (!data[type][index].text.trim()) return;
  data[type][index].done = !data[type][index].done;
  setDayData(currentDateKey, data);
  renderTaskList('shortList', data[type], type);
  updateProgress();
}

function saveTask(type, index, value) {
  if (isDayLocked(currentDateKey)) return;
  const data = getDayData(currentDateKey);
  data[type][index].text = value;
  setDayData(currentDateKey, data);
  renderDayNav(true);
}

function clearDay() {
  if (isPastDay(currentDateKey)) return;
  if (!confirm('Reset all tasks for this day?')) return;
  setDayData(currentDateKey, emptyDay());
  renderDay();
  renderDayNav();
}

// ─────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────
function barColorClass(pct) {
  if (pct >= 85) return 'bar-green';
  if (pct >= 50) return 'bar-yellow';
  return '';  // default red via CSS
}

function isPastDay(dk) {
  return dk < dateKey(today());
}

function isFutureDay(dk) {
  return dk > dateKey(today());
}

// Prior-day tasks lock at 3:00 PM of the current day.
// Example: Monday's tasks lock at 3 PM on Tuesday.
// Today and future days never lock.
function isDayLocked(dk) {
  if (dk >= dateKey(today())) return false;        // today & future: editable
  const deadline = dateFromKey(dk);                // midnight of that day
  deadline.setDate(deadline.getDate() + 1);        // the next calendar day
  deadline.setHours(15, 0, 0, 0);                  // 3:00 PM
  return new Date() >= deadline;                   // locked once 3 PM passes
}

// ─────────────────────────────────────────
// PROGRESS
// ─────────────────────────────────────────
function updateProgress() {
  const data = getDayData(currentDateKey);
  const all = [
    data.mit.text ? data.mit.done : null,
    ...data.short.map(t => t.text ? t.done : null),
    ...MAINT_HABITS.map(h => {
      const state = data.maint[h.key];
      if (state === 'skip') return null;   // excluded entirely
      return state === 'done';             // true or false
    }),
  ].filter(v => v !== null);

  const total = all.length;
  const done  = all.filter(Boolean).length;
  const pct   = total ? Math.round((done / total) * 100) : 0;

  const fill = document.getElementById('progressFill');
  fill.style.width = pct + '%';
  fill.className = 'progress-bar-fill ' + barColorClass(pct);
  document.getElementById('progressLabel').textContent = `${done} / ${total || 7}`;

  const emojis = ['🎯','🌱','💪','⚡','🔥','🏆','✨'];
  document.getElementById('progressEmoji').textContent = emojis[Math.min(Math.floor(pct / 17), 6)];
}

// ─────────────────────────────────────────
// MOVE / COPY POPOVER
// ─────────────────────────────────────────
function setPopoverMode(mode) {
  popoverMode = mode;
  document.getElementById('modeTabMove').classList.toggle('active', mode === 'move');
  document.getElementById('modeTabCopy').classList.toggle('active', mode === 'copy');
  document.getElementById('movePanelInner').style.display  = mode === 'move' ? '' : 'none';
  document.getElementById('copyPanelInner').style.display  = mode === 'copy' ? '' : 'none';
}

function showMovePopover(type, event, index) {
  event.stopPropagation();
  if (isDayLocked(currentDateKey)) return;
  pendingMove = { type, index };
  pendingCopy = { type, index };
  copySelections.clear();

  const popover = document.getElementById('movePopover');
  const overlay = document.getElementById('overlay');

  // --- MOVE list: future business days only, up to 3 ---
  const moveDayList = document.getElementById('moveDayList');
  moveDayList.innerHTML = '';
  const moveDays = getFutureBusinessDays(currentDateKey, 3);
  if (moveDays.length === 0) {
    moveDayList.innerHTML = '<div style="font-size:12px;color:var(--grey-mid);padding:6px 10px;">No future business days available</div>';
  } else {
    moveDays.forEach(d => {
      const dk = dateKey(d);
      const btn = document.createElement('button');
      btn.className = 'move-day-item';
      btn.innerHTML = `<span class="di-day">${DAY_NAMES[d.getDay()]}</span>
        <span class="di-date">${MONTH_NAMES[d.getMonth()]} ${d.getDate()}</span>`;
      btn.onclick = () => moveTask(dk);
      moveDayList.appendChild(btn);
    });
  }

  // --- COPY list: up to 7 future days (excluding Saturday) ---
  const copyDayList = document.getElementById('copyDayList');
  copyDayList.innerHTML = '';
  const copyDays = getFutureCopyDays(currentDateKey, 7);
  copyDays.forEach(d => {
    const dk = dateKey(d);
    const item = document.createElement('button');
    item.className = 'copy-day-item';
    item.dataset.dk = dk;
    item.innerHTML = `
      <span class="cdi-check"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" style="display:none" id="chk-${dk}">
        <polyline points="1.5,5 3.8,7.5 8.5,2" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg></span>
      <span class="di-day">${DAY_NAMES[d.getDay()]}</span>
      <span class="di-date">${MONTH_NAMES[d.getMonth()]} ${d.getDate()}</span>`;
    item.onclick = () => toggleCopyDay(dk, item);
    copyDayList.appendChild(item);
  });
  updateCopyConfirmBtn();

  // default to move mode
  setPopoverMode('move');

  const rect = event.currentTarget.getBoundingClientRect();
  const pw = 230;
  let left = rect.right - pw;
  let top  = rect.bottom + 6;
  if (left < 8) left = 8;
  if (top + 380 > window.innerHeight) top = rect.top - 380;
  popover.style.left  = left + 'px';
  popover.style.top   = top + 'px';
  popover.style.width = pw + 'px';
  popover.classList.add('show');
  overlay.classList.add('show');
}

function toggleCopyDay(dk, itemEl) {
  if (copySelections.has(dk)) {
    copySelections.delete(dk);
    itemEl.classList.remove('selected');
    const chk = itemEl.querySelector('svg');
    if (chk) chk.style.display = 'none';
  } else {
    copySelections.add(dk);
    itemEl.classList.add('selected');
    const chk = itemEl.querySelector('svg');
    if (chk) chk.style.display = 'block';
  }
  updateCopyConfirmBtn();
}

function updateCopyConfirmBtn() {
  const btn = document.getElementById('copyConfirmBtn');
  const n = copySelections.size;
  btn.disabled = n === 0;
  btn.textContent = n === 0 ? 'Copy to selected' : `Copy to ${n} day${n > 1 ? 's' : ''}`;
}

function confirmCopy() {
  if (!pendingCopy || copySelections.size === 0) return;
  const { type, index } = pendingCopy;
  const srcData = getDayData(currentDateKey);

  copySelections.forEach(targetDk => {
    const dstData = getDayData(targetDk);

    if (type === 'mit') {
      const task = { ...srcData.mit, done: false };
      if (!dstData.mit.text) {
        dstData.mit = task;
      } else {
        const slot = dstData.short.findIndex(t => !t.text);
        if (slot >= 0) dstData.short[slot] = task;
      }
    } else {
      const task = { ...srcData[type][index], done: false };
      const slot = dstData[type].findIndex(t => !t.text);
      if (slot >= 0) dstData[type][slot] = task;
      else           dstData[type][0]    = task;
    }
    setDayData(targetDk, dstData);
  });

  closePopover();
  renderDay();
  renderDayNav();
}

function moveTask(targetDateKey) {
  if (!pendingMove) return;
  if (isDayLocked(currentDateKey)) return;
  const { type, index } = pendingMove;

  const srcData = getDayData(currentDateKey);
  const dstData = getDayData(targetDateKey);

  if (type === 'mit') {
    const task = { ...srcData.mit };
    srcData.mit = { text: '', done: false };
    if (dstData.mit.text) {
      const slot = dstData.short.findIndex(t => !t.text);
      if (slot >= 0) dstData.short[slot] = { ...task, done: false };
    } else {
      dstData.mit = { ...task, done: false };
    }
  } else {
    const task = { ...srcData[type][index] };
    srcData[type][index] = { text: '', done: false };
    const slot = dstData[type].findIndex(t => !t.text);
    if (slot >= 0) dstData[type][slot] = { ...task, done: false };
    else           dstData[type][0]    = { ...task, done: false };
  }

  setDayData(currentDateKey, srcData);
  setDayData(targetDateKey,  dstData);
  closePopover();
  renderDay();
  renderDayNav();
}

function closePopover() {
  document.getElementById('movePopover').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
  pendingMove = null;
  pendingCopy = null;
  copySelections.clear();
}

// ─────────────────────────────────────────
// WEEKLY SUMMARY (used by week view / kept for compatibility)
// ─────────────────────────────────────────
function renderWeekSummary() {
  const { days, monday, sunday } = getWeekRange(weekOffset);
  const container = document.getElementById('weekContent');
  if (!container) return;
  container.innerHTML = '';

  const fmtDate = d => `${MONTH_NAMES[d.getMonth()]} ${d.getDate()}`;
  const sel = document.createElement('div');
  sel.className = 'week-selector';
  sel.innerHTML = `
    <button class="week-nav-btn" onclick="changeWeek(-1)" aria-label="Previous week">&#8592;</button>
    <div class="week-range-label">${fmtDate(monday)} – ${fmtDate(sunday)}</div>
    <button class="week-nav-btn" onclick="changeWeek(1)" ${weekOffset === 0 ? 'disabled style="opacity:.4;cursor:default"' : ''} aria-label="Next week">&#8594;</button>
  `;
  container.appendChild(sel);

  const { sections, totalTasks, doneTasks } = buildWeekSections(days);
  const overallPct = totalTasks ? Math.round((doneTasks / totalTasks) * 100) : 0;

  buildWeekSummaryInto(container, days, sections, totalTasks, doneTasks, overallPct, monday, sunday);
}

function changeWeek(delta) {
  const newOffset = weekOffset + delta;
  if (newOffset > 0) return;
  weekOffset = newOffset;
  renderWeekSummary();
}

function fmtDayKey(dk) {
  const d = dateFromKey(dk);
  return `${DAY_NAMES[d.getDay()]} ${MONTH_NAMES[d.getMonth()]} ${d.getDate()}`;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

// ─────────────────────────────────────────
// MOBILE KEYBOARD HANDLING
// ─────────────────────────────────────────
// Goal: when the on-screen keyboard is open and text is being entered, the page
// must stay exactly where the user scrolled. We do NOT auto-scroll the page on
// focus, keystroke, or viewport resize. We only add a one-time bottom cushion of
// scrollable space so the user can manually scroll a low field above the keyboard
// if they wish — without the page ever jumping on its own.
(function() {
  let keyboardOpen = false;

  function applyKeyboardPadding() {
    const vv = window.visualViewport;
    if (!vv) return;
    // How much of the layout viewport is currently hidden by the keyboard
    const hidden = Math.max(0, (window.innerHeight - vv.height - vv.offsetTop));
    const open = hidden > 100; // keyboard considered open
    if (open && !keyboardOpen) {
      keyboardOpen = true;
      // Add scrollable cushion once so low fields can be scrolled into view manually.
      document.body.style.paddingBottom = (40 + hidden + 24) + 'px';
    } else if (!open && keyboardOpen) {
      keyboardOpen = false;
      document.body.style.paddingBottom = '40px';
    }
  }

  if (window.visualViewport) {
    // Only react to the keyboard opening/closing (resize), never to scroll,
    // and never move the page ourselves.
    window.visualViewport.addEventListener('resize', applyKeyboardPadding);
  }
})();

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopover(); });

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
function init() {
  // dayNavWeekOffset starts at 0 (current week containing today)
  renderHeaderDate();
  renderDayNav();
  if (isSaturday(currentDateKey)) {
    renderSaturdayView();
  } else {
    renderDay();
  }
}
init();
